name: TALENTRA.ID CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  frontend:
    name: Frontend Verification (Typecheck, Invariants, Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Frontend invariant tests (Phases 1-9)
        run: npm test

      - name: Next.js production build
        env:
          NEXT_PUBLIC_APP_ENV: 'test'
          NEXT_PUBLIC_ENABLE_DEMO_AUTH: 'false'
        run: npm run build

  backend:
    name: Backend Verification & Migration Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Phase & Architecture Kit
        run: python scripts/validate_kit.py

      - name: Verify Alembic Migration Head
        env:
          APP_ENV: 'test'
          DATABASE_URL: 'sqlite+aiosqlite:///./test_ci.db'
        run: |
          cd backend
          alembic upgrade head
          cd ..

      - name: Run Backend Unit & Security Tests
        env:
          APP_ENV: 'test'
          DATABASE_URL: 'sqlite+aiosqlite:///:memory:'
          JWT_SECRET_KEY: 'ci-test-secret-key-32-bytes-minimum-length'
          IDENTIFIER_LOOKUP_PEPPER: 'ci-test-lookup-pepper-32-bytes-min'
          CV_VERIFICATION_TOKEN_PEPPER: 'ci-test-cv-pepper-32-bytes-min'
          PUBLIC_APP_URL: 'http://localhost:3000'
        run: |
          python -m pytest backend/tests -v -o asyncio_mode=auto -m "not integration_real"

  optional-cloud-integration:
    name: Optional Real Neon & Vercel Blob Integration Gate
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: "${{ secrets.NEON_TEST_DATABASE_URL != '' }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Cloud Integration Tests
        env:
          APP_ENV: 'test'
          DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.VERCEL_BLOB_TOKEN }}
          OBJECT_STORAGE_PROVIDER: 'vercel_blob'
        run: |
          python -m pytest backend/tests -v -o asyncio_mode=auto -m "integration_real"
