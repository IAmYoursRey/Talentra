[project]
name = "app"
version = "0.1.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.8.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.1.0",
    "asyncpg>=0.29.0",
    "alembic>=1.13.3",
    "pymongo>=4.9.0",
    "boto3>=1.35.0",
    "reportlab>=4.0.0",
    "qrcode>=7.4.0",
    "pillow>=10.0.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0"
]
requires-python = ">=3.12"

[tool.pyright]
include = ["backend"]
extraPaths = [".", "backend"]

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["backend/tests"]
